<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form action="thankyou.html" method="post">
        <table>
            <tr>
                <td>Name</td>
                <td><input type="text" name="name" placeholder="Enter name..."></td>
            </tr>
            <tr>
                <td>Surname</td>
                <td><input type="text" name="sname" required></td>
            </tr>
            <tr>
                <td>Age</td>
                <td><input type="number" name="" id=""></td>
            </tr>
            <tr>
                <td>Mobile</td>
                <td><input type="tel" name="" id=""></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="" id=""></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="" id=""></td>
            </tr>
            <tr>
                <td>Address</td>
                <td>
                    <textarea rows="10" cols="16" name="" id=""></textarea>
                </td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    Male <input type="radio" name="gender" id="" value="male">
                    Female <input type="radio" name="gender" value="female">
                </td>
            </tr>
            <tr>
                <td>Hobbies</td>
                <td>
                    Cricket <input type="checkbox" name="hobby" value="cricket">
                    hockey <input type="checkbox" name="hobby" value="hockey">
                </td>
            </tr>
            <tr>
                <td>DOB</td>
                <td><input type="date"></td>
                <td><input type="datetime-local"></td>
                <td><input type="week"></td>

            </tr>
            <tr>
                <td>color</td>
                <td><input type="color" name="color"></td>
            </tr>
            <tr>
                <td>Salary</td>
                <td><input type="range" name="salary"></td>
            </tr>
            <tr>
                <td>City</td>
                <td>
                    <select name="City" id="">
                        <option value="" disabled selected>Select</option>
                        <option value="ahmedabad">Ahmedabad</option>
                        <option value="surat">surat</option>
                        <option value="baroda">Baroda</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Attach file</td>
                <td><input type="file" name="" id=""></td>
            </tr>
            <tr>
                <td><input type="submit" value="register"></td>
            </tr>
        </table>
    </form>
    
</body>
</html>
