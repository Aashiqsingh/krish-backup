<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        height: 300px;
        width: 300px;
        background-color: rgba(0, 128, 128, 0.749);

        color: white;

        /* text formatting  */

        font-family: 'Courier New', Courier, monospace;
        font-family: cursive;
        font-size: large;
        font-size: xx-large;
        font-size: 18px;
        font-weight: 900;

        font-style: italic;
        font-style: oblique;


        text-align: end;
        text-align: center;
        text-align: justify;

        text-decoration: underline;
        text-decoration: line-through;
        text-decoration: overline red;

        text-decoration: underline blue solid;
        text-decoration: underline blue dotted;
        text-decoration: underline blue dashed;
        text-decoration: underline blue double;
        text-decoration: underline blue wavy;
        text-decoration: yellow dotted underline;

        text-transform: capitalize;
        text-transform: lowercase;

        text-shadow: 2px 2px 2px red;

        /* 
            first 2px : left or right
            second 2px : top or bottom
            third 2px : blur
            color:
        */

        text-shadow: 1px 2px 0px blue;
        text-shadow: -2px -2px 5px blue;

        text-shadow: 2px 2px 1px rgba(255, 255, 0, 0.374) , -2px -2px 1px rgba(0, 0, 255, 0.443);


    }
</style>
<body>

    <div class="box">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Aperiam voluptatem perferendis minima quas quam quaerat optio mollitia voluptatum assumenda? Reprehenderit tenetur, quaerat molestias qui minus enim veniam quisquam! Expedita, natus?
    </div>
    
</body>
</html>
